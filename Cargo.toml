[package]
name = "taskbar-panels"
version = "1.5.0"
edition = "2021"
description = "Paneles modernos para la barra de tareas de Windows 11: red, consumo de Claude/Copilot, sistema (CPU/GPU/FPS/discos) y multimedia"
license = "MIT"
readme = "README.md"
authors = ["taskbar-panels contributors"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.10", features = ["json"] }
rustfft = "6"

[dependencies.windows]
version = "0.58.0"
features = [
  "Foundation", "Media_Control", "Storage_Streams", "Graphics_Imaging",
  "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_HiDpi",
  "Win32_UI_Shell", "Win32_UI_Controls", "Win32_System_LibraryLoader", "Win32_System_Com",
  "Win32_System_Variant", "Win32_System_Wmi", "Win32_System_Performance",
  "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock",
  "Media_Playback", "Media_Core", "Win32_Media_Audio", "Win32_System_Threading", "Win32_System_DataExchange", "Win32_System_Memory",
  "Win32_System_Ole", "Win32_UI_Input_KeyboardAndMouse", "Win32_Security", "Win32_System_WinRT",
  "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_UI_Accessibility", "Win32_Graphics_Dwm", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_System_Time", "Win32_Storage_FileSystem", "Win32_Globalization", "Win32_Security_Credentials", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_DXCore"
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = false
debug = 1
