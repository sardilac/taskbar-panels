# Envío manual de un release a microsoft/winget-pkgs (el automático va en release.yml, job "winget").
# Requisitos (una sola vez):
#   - el paquete ya existe en winget-pkgs (la primera versión se envía a mano con wingetcreate);
#   - un fork de microsoft/winget-pkgs en la cuenta del dueño del repositorio;
#   - el secreto WINGET_TOKEN: PAT clásico con el permiso "public_repo".
name: winget

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag del release a enviar (p. ej. v1.3.0)"
        required: true

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Comprobar el secreto
        id: check
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:WINGET_TOKEN)) {
            Write-Warning 'Falta el secreto WINGET_TOKEN: no se envía la actualización a winget'
            "ok=false" >> $env:GITHUB_OUTPUT
          } else { "ok=true" >> $env:GITHUB_OUTPUT }

      - uses: vedantmgoyal9/winget-releaser@main
        if: steps.check.outputs.ok == 'true'
        with:
          identifier: sardilac.TaskbarPanels
          installers-regex: 'TaskbarPanels-Setup-v[\d.]+-x64\.exe$'
          release-tag: ${{ inputs.tag }}
          token: ${{ secrets.WINGET_TOKEN }}
