# Compila y publica un release al subir un tag vX.Y.Z (p. ej. git tag v1.3.0 && git push origin v1.3.0):
# zip + instalador (Inno Setup), cada uno con su .sha256
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust estable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Instalar Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Compilar y empaquetar
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Comprobar que existe el instalador
        shell: pwsh
        run: if (-not (Get-ChildItem dist -Filter 'TaskbarPanels-Setup-*.exe')) { throw 'no se generó el instalador' }

      - name: Publicar el release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.zip.sha256
            dist/TaskbarPanels-Setup-*.exe
            dist/TaskbarPanels-Setup-*.exe.sha256
          generate_release_notes: true

  # Envía la versión a winget (microsoft/winget-pkgs). Va en este workflow porque un release creado con
  # GITHUB_TOKEN no dispara otros workflows. Requiere el secreto WINGET_TOKEN (PAT clásico, "public_repo")
  # y un fork de microsoft/winget-pkgs en la cuenta; sin el secreto, se omite con un aviso.
  winget:
    needs: release
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Comprobar el secreto
        id: check
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:WINGET_TOKEN)) {
            Write-Warning 'Falta el secreto WINGET_TOKEN: no se envía la actualización a winget'
            "ok=false" >> $env:GITHUB_OUTPUT
          } else { "ok=true" >> $env:GITHUB_OUTPUT }

      - uses: vedantmgoyal9/winget-releaser@main
        if: steps.check.outputs.ok == 'true'
        with:
          identifier: sardilac.TaskbarPanels
          installers-regex: 'TaskbarPanels-Setup-v[\d.]+-x64\.exe$'
          release-tag: ${{ github.ref_name }}
          token: ${{ secrets.WINGET_TOKEN }}
