# Compila y publica un release al subir un tag vX.Y.Z (p. ej. git tag v1.0.0 && git push origin v1.0.0)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust estable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Compilar y empaquetar
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Publicar el release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.zip.sha256
          generate_release_notes: true
